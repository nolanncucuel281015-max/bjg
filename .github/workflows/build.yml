name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build mod
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Inspect vanilla data (temporaire)
        continue-on-error: true
        run: |
          JAR=$(find ~/.gradle/caches -name "*.jar" -path "*minecraft*" -size +10M | while read j; do unzip -l "$j" 2>/dev/null | grep -q "data/minecraft/dimension_type/overworld.json" && echo "$j" && break; done)
          echo "JAR=$JAR"
          mkdir -p /tmp/v && cd /tmp/v && unzip -q -o "$JAR" 'data/minecraft/*' 'version.json' || true
          for f in version.json data/minecraft/dimension_type/overworld.json data/minecraft/dimension_type/the_end.json data/minecraft/dimension/*.json data/minecraft/worldgen/biome/plains.json data/minecraft/worldgen/biome/end_highlands.json data/minecraft/worldgen/biome/crimson_forest.json data/minecraft/worldgen/structure/bastion_remnant.json data/minecraft/worldgen/structure/end_city.json data/minecraft/worldgen/structure_set/end_cities.json data/minecraft/worldgen/structure_set/nether_complexes.json data/minecraft/worldgen/template_pool/end_city/start.json data/minecraft/recipe/netherite_sword_smithing.json data/minecraft/recipe/iron_ingot_from_smelting_raw_iron.json data/minecraft/worldgen/configured_feature/ore_diamond.json data/minecraft/worldgen/placed_feature/ore_diamond.json; do echo "===== $f"; cat $f; echo; done
          echo "===== noise_settings/floating_islands"; head -c 6000 data/minecraft/worldgen/noise_settings/floating_islands.json
          echo; echo "===== noise_settings/end"; head -c 3000 data/minecraft/worldgen/noise_settings/end.json
          ls data/minecraft/timeline 2>/dev/null; for f in data/minecraft/timeline/*.json; do echo "===== $f"; head -c 1500 $f; echo; done
      - uses: actions/upload-artifact@v4
        with:
          name: diamond-altar-mod
          path: build/libs/*.jar
      - name: Build plugin + resource pack
        run: ./gradlew -p plugin build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: diamond-altar-plugin
          path: |
            plugin/build/libs/*.jar
            plugin/build/libs/*.zip
            plugin/LISEZMOI.txt
