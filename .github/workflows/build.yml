name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build mod
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: diamond-altar-mod
          path: build/libs/*.jar
      - name: Build plugin + resource pack
        run: ./gradlew -p plugin build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: diamond-altar-plugin
          path: |
            plugin/build/libs/*.jar
            plugin/build/libs/*.zip
            plugin/LISEZMOI.txt
