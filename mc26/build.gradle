// Version 26.3 du mod : mêmes sources que la version 1.21.11 (dossier racine src/),
// plus les fichiers de mc26/overrides/ qui remplacent ceux qui diffèrent en 26.3.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

/**
 * Préprocesseur des sources communes pour la 26.3 :
 *   // #if 1.21.11      <- code 1.21.11 (supprimé en 26.3)
 *   // #else
 *   //? code 26.3        <- décommenté en 26.3
 *   // #endif
 * et toute ligne finissant par « // @1.21.11 » est supprimée en 26.3.
 */
class Mc26Preprocess extends FilterReader {
	Mc26Preprocess(Reader r) { super(new StringReader(transform(r.text))) }
	/** Renommages automatiques 1.21.11 -> 26.3 (affichage client et Fabric API). */
	static final List<List<String>> RENAMES = [
		[/\bnet\.minecraft\.client\.gui\.GuiGraphics\b/, "net.minecraft.client.gui.GuiGraphicsExtractor"],
		[/\bGuiGraphics\b/, "GuiGraphicsExtractor"],
		[/\.drawString\(/, ".text("],
		[/\.drawWordWrap\(/, ".textWithWordWrap("],
		[/\.renderItemDecorations\(/, ".itemDecorations("],
		[/\.renderItem\(/, ".item("],
		[/public void render\(GuiGraphicsExtractor /, "public void extractRenderState(GuiGraphicsExtractor "],
		[/super\.render\(/, "super.extractRenderState("],
		[/public void renderBackground\(GuiGraphicsExtractor /, "public void extractBackground(GuiGraphicsExtractor "],
		[/super\.renderBackground\(/, "super.extractBackground("],
		[/net\.fabricmc\.fabric\.api\.client\.keybinding\.v1\.KeyBindingHelper/, "net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper"],
		[/KeyBindingHelper\.registerKeyBinding\(/, "KeyMappingHelper.registerKeyMapping("],
		[/\bKeyBindingHelper\b/, "KeyMappingHelper"],
		[/net\.fabricmc\.fabric\.api\.client\.particle\.v1\.ParticleFactoryRegistry/, "net.fabricmc.fabric.api.client.particle.v1.ParticleProviderRegistry"],
		[/\bParticleFactoryRegistry\b/, "ParticleProviderRegistry"],
		[/\.setScreen\(/, ".setScreenAndShow("],
		[/net\.minecraft\.client\.renderer\.state\.CameraRenderState/, "net.minecraft.client.renderer.state.level.CameraRenderState"],
		[/InputConstants\.Type\.KEYSYM/, "InputConstants.Type.KEYBOARD"],
	]

	static String transform(String src) {
		def out = new StringBuilder()
		String mode = "both"
		src.eachLine { String line ->
			def t = line.trim()
			if (t == "// #if 1.21.11") { mode = "old"; return }
			if (t == "// #else" && mode == "old") { mode = "new"; return }
			if (t == "// #endif" && mode != "both") { mode = "both"; return }
			if (mode == "old") return
			if (mode == "new") { out.append(line.replaceFirst(/^(\s*)\/\/\? ?/, '$1')).append('\n'); return }
			if (t.endsWith("// @1.21.11")) return
			out.append(line).append('\n')
		}
		String result = out.toString()
		for (r in RENAMES) {
			result = result.replaceAll(r[0], java.util.regex.Matcher.quoteReplacement(r[1]))
		}
		return result
	}
}

def synced = layout.buildDirectory.dir("synced")
def syncTask = { String name, String set, String kind ->
	tasks.register(name, Sync) {
		from("overrides/${set}/${kind}")       // prioritaire
		from("../src/${set}/${kind}") {
			// fichiers supprimés en 26.3 (liste dans overrides/removed.txt)
			def removed = file("overrides/removed.txt")
			if (removed.exists()) {
				exclude(removed.readLines().findAll { it.trim() && !it.startsWith("#") && it.startsWith("${set}/${kind}/") }
						.collect { it.substring("${set}/${kind}/".length()) })
			}
		}
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
		filesMatching("**/*.java") { it.filter(Mc26Preprocess) }
		into(synced.map { it.dir("${set}/${kind}") })
	}
}
def syncMainJava = syncTask("syncMainJava", "main", "java")
def syncMainRes = syncTask("syncMainResources", "main", "resources")
def syncClientJava = syncTask("syncClientJava", "client", "java")

loom {
	accessWidenerPath = file("overrides/main/resources/diamondaltar.classtweaker").exists()
			? file("overrides/main/resources/diamondaltar.classtweaker")
			: file("../src/main/resources/diamondaltar.classtweaker")
	splitEnvironmentSourceSets()

	runs {
		server {
			vmArg "-Ddiamondaltar.selftest=" + (System.getenv("DIAMONDALTAR_SELFTEST") ?: "false")
			programArg "--nogui"
		}
	}

	mods {
		"diamondaltar" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java.srcDirs = [synced.map { it.dir("main/java") }]
		resources.srcDirs = [synced.map { it.dir("main/resources") }]
	}
	client {
		java.srcDirs = [synced.map { it.dir("client/java") }]
		resources.srcDirs = []
	}
}

tasks.named("compileJava") { dependsOn syncMainJava }
tasks.named("compileClientJava") { dependsOn syncClientJava }
tasks.named("processResources") { dependsOn syncMainRes }
tasks.matching { it.name == "sourcesJar" }.configureEach { dependsOn syncMainJava, syncMainRes, syncClientJava }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
